name: CI

# サイト全体のテストとビルドはこちらで見る。
# 記事の同期（sync-note-rss.yml）とは分けてあるので、
# ここが赤くてもnoteの更新は止まらない。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
