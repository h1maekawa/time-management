# Supabase CLI project config for DAYLOOP.
# ローカル開発時: `supabase start` でこの設定を使ってローカルSupabaseスタックを起動できる。
# 本番/PreviewはSupabase Dashboardでプロジェクトを作成し、
# `supabase link --project-ref <ref>` の上で `supabase db push` を実行する
# （詳細は docs/SUPABASE_SETUP.md）。

project_id = "dayloop"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Email OTP（6桁コード）を使用。Magic Link Templateではなくコードのみ利用する。
otp_length = 6
otp_expiry = 600

[auth.sms]
enable_signup = false
